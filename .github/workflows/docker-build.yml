name: Docker Build

run-name: Docker Build ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag to build and publish
        required: true
        type: string

jobs:
  build:
    name: Build and Push Multi-Arch Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout upstream tag
        uses: actions/checkout@v6
        with:
          repository: attestantio/dirk
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Fetch docker branch from fork
        run: |
          git remote add fork https://github.com/${{ github.repository }}.git
          git fetch fork dockerfile-multi-arch

      - name: Overlay docker files
        run: |
          git checkout FETCH_HEAD -- Dockerfile .dockerignore

      - name: Derive image tag
        id: image_tag
        run: |
          image_tag="${INPUT_TAG#v}"
          echo "value=$image_tag" >> "$GITHUB_OUTPUT"
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: |
            linux/amd64
            linux/arm64
          tags: ghcr.io/${{ github.repository }}:${{ steps.image_tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
